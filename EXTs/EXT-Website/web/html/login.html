<div class="card card-authentication1 mx-auto my-5">
  <div class="card-body">
    <div class="card-content p-2">
      <div class="text-center">
        <img src="/assets/images/bugsounet.png" alt="logo icon">
      </div>
      <div class="card-title text-uppercase text-center py-3">Sign In</div>
      <form id="login">
        <div class="mb-3">
          <label for="exampleInputUsername" class="sr-only">Username</label>
          <div class="position-relative has-icon-right">
            <div class="input-group">
              <div class="input-group-text">@</div>
              <input type="text" id="username" class="form-control input-shadow" placeholder="Enter Username" autocomplete="username">
            </div>
            <div class="form-control-position">
              <i class="icon-user text-white"></i>
            </div>
          </div>
        </div>
        <div class="mb-3">
          <label for="password" class="sr-only">Password</label>
          <div class="position-relative has-icon-right">
            <div class="input-group">
              <div class="input-group-text"><i class="fa-solid fa-key"></i></div>
              <input type="password" id="password" class="form-control input-shadow" placeholder="Enter Password" autocomplete="current-password">
              <div class="form-control-position">
                <i toggle="#password" class="icon-eye toggle-password text-white"></i>
              </div>
            </div>

          </div>
        </div>
        <div class="row">
          <div class="mb-3"></div>
        </div>
        <div class="text-center">
          <button type="submit" id="login-submit" class="btn-round btn-light btn-block">Sign In</button>
        </div>
      </form>
    </div>
  </div>
</div>
