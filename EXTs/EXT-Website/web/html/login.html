<div class="card card-authentication mx-auto my-5">
  <div class="card-body">
    <div class="card-content p-2">
      <div class="text-center">
        <img src="/assets/images/bugsounet.png" alt="logo icon">
      </div>
      <form id="login">
        <div class="mt-5 mb-4">
          <div class="position-relative input-group mb-3">
            <div class="input-group-text">
              <i class="fa-solid fa-at"></i>
            </div>
            <input type="text" id="username" class="form-control input-shadow" placeholder="Enter Username" autocomplete="username" required>
            <div class="input-group-text">
              <i class="icon-user text-white me-0"></i>
            </div>
          </div>
          <div class="position-relative input-group mb-3">
            <div class="input-group-text">
              <i class="fa-solid fa-key"></i>
            </div>
            <input type="password" id="password" class="form-control input-shadow" placeholder="Enter Password" autocomplete="current-password" required>
            <div class="input-group-text">
              <i toggle="#password" class="icon-eye toggle-password text-white me-0"></i>
            </div>
          </div>
        </div>
        <div class="text-center">
          <button type="submit" id="login-submit" class="btn-round btn-light btn-block">Sign In</button>
        </div>
      </form>
    </div>
  </div>
</div>
